<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vídeos | A Vida do Senhor Jesus</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Cabeçalho Simples -->
  <header class="header-simple">
    <div class="container">
      <h1>Vídeos</h1>
      <a href="index.html" class="btn small">Início</a>
    </div>
  </header>

  <!-- Feed de Vídeos -->
  <section class="container feed" id="feedVideos"></section>

  <!-- Scripts -->
  <script src="js/videos.js"></script>
  <script>
    const feed = document.getElementById('feedVideos');

    videos.forEach((video, index) => {
      const isSemana = video.id === getVideoDaSemana().id;

      const card = document.createElement('div');
      card.className = 'video-card';
      if (isSemana) card.innerHTML += '<div class="badge">Vídeo da Semana</div>';

      card.innerHTML += `
        <div class="video-wrapper">
          <iframe src="https://www.youtube.com/embed/${video.youtubeId}" 
                  frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="video-info">
          <h3>${video.title}</h3>
          <p class="verse">${video.verse}</p>
          <div class="actions">
            <button onclick="curtir(${index})"> <span id="like${index}">${video.likes}</span></button>
            <button onclick="toggleComment(${index})"> <span id="comm${index}">${video.comments.length}</span></button>
          </div>
          <div id="commentsList${index}" class="comments-list"></div>
          <div id="commentBox${index}" style="display:none;">
            <textarea id="textarea${index}" placeholder="Escreva um comentário..."></textarea>
            <button class="btn small" onclick="enviarComentario(${index})">Enviar</button>
          </div>
        </div>
      `;
      feed.appendChild(card);
      updateComments(index);
    });

    function curtir(i) {
      videos[i].likes++;
      document.getElementById(`like${i}`).textContent = videos[i].likes;
      saveVideoData();
    }

    function toggleComment(i) {
      const box = document.getElementById(`commentBox${i}`);
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function enviarComentario(i) {
      const textarea = document.getElementById(`textarea${i}`);
      const text = textarea.value.trim();
      if (text) {
        videos[i].comments.push(text);
        document.getElementById(`comm${i}`).textContent = videos[i].comments.length;
        textarea.value = '';
        updateComments(i);
        saveVideoData();
      }
    }

    function updateComments(i) {
      const list = document.getElementById(`commentsList${i}`);
      list.innerHTML = videos[i].comments.map(c => 
        `<p class="comment"><strong>Visitante:</strong> ${c}</p>`
      ).join('');
    }
  </script>
</body>
</html>
