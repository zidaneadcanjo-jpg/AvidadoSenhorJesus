<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Vídeos - A Vida do Senhor Jesus</title>
    <link rel="stylesheet" href="videos.css">
</head>
<body>

<!-- Menu parecido com Facebook -->
<header>
    <div class="menu">
        <a href="index.html" class="logo">A Vida do Senhor Jesus</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="videos.html" class="active">Vídeos</a>
        </nav>
    </div>
</header>

<main>
    <section class="section-destaque">
        <h2>Vídeo da Semana</h2>
        <div id="video-semana" class="video-card destaque"></div>
    </section>

    <section class="section-recentes">
        <h2>Últimos Vídeos</h2>
        <div id="videos-recentes"></div>
    </section>
</main>

<script src="videos.js"></script>
<script>
const videoSemanaDiv = document.getElementById('video-semana');
const videosRecentesDiv = document.getElementById('videos-recentes');

videos.forEach(v => {
    const videoHTML = `
        <h3>${v.titulo}</h3>
        <iframe src="${v.link}" allowfullscreen></iframe>
        <p>${v.descricao}</p>
    `;
    if (v.destaque) {
        videoSemanaDiv.innerHTML = videoHTML;
    } else {
        videosRecentesDiv.innerHTML += `<div class="video-card">${videoHTML}</div>`;
    }
});
</script>

</body>
</html>
