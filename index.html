<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Vida do Senhor Jesus</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- MENU 100% FUNCIONAL NO TELEMÓVEL -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span>A Vida do Senhor Jesus</span>
      </a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link active">Início</a></li>
        <li><a href="sobre.html" class="nav-link">Sobre</a></li>
        <li><a href="milagres.html" class="nav-link">Milagres</a></li>
        <li><a href="galeria.html" class="nav-link">Galeria</a></li>
        <li><a href="videos.html" class="nav-link">Vídeos</a></li>
        <li><a href="divulgue.html" class="nav-link">Divulgue</a></li>
        <li><a href="contactos.html" class="nav-link">Contactos</a></li>
      </ul>
      <div class="nav-toggle" id="mobileMenu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </nav>

  <!-- Cabeçalho -->
  <header class="hero">
    <div class="container">
      <h1>A Vida do Senhor Jesus</h1>
      <p class="subtitle">Conheça o caminho, a verdade e a vida</p>
    </div>
  </header>

  <!-- Vídeo da Semana -->
  <section class="video-semana container" id="videoSemana">
    <h2>Vídeo da Semana</h2>
    <div id="videoContainer"></div>
    <blockquote id="verseQuote"></blockquote>
    <p class="stats">
      <span id="likesCount">0</span> curtidas • 
      <span id="commentsCount">0</span> comentários
    </p>
    <button class="btn" onclick="curtirVideoSemana()">Curtir</button>
    <a href="videos.html" class="btn secondary">Ver Todos os Vídeos</a>
  </section>

  <footer>
    <p>© 2025 A Vida do Senhor Jesus | Feito com amor em Cristo</p>
  </footer>

  <!-- Scripts -->
  <script src="js/videos.js"></script>
  <script>
    // === VÍDEO DA SEMANA ===
    const videoSemana = getVideoDaSemana();
    document.getElementById('videoContainer').innerHTML = `
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/${videoSemana.youtubeId}" 
                frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <h3>${videoSemana.title}</h3>
    `;
    document.getElementById('verseQuote').innerHTML = `
      “${videoSemana.verse}” 
      <cite>— Bíblia Sagrada</cite>
    `;
    function atualizarStats() {
      document.getElementById('likesCount').textContent = videoSemana.likes;
      document.getElementById('commentsCount').textContent = videoSemana.comments.length;
    }
    atualizarStats();
    function curtirVideoSemana() {
      videoSemana.likes++;
      saveVideoData();
      atualizarStats();
    }

    // === MENU MOBILE 100% FUNCIONAL ===
    document.addEventListener('DOMContentLoaded', () => {
      const mobileMenu = document.getElementById('mobileMenu');
      const navMenu = document.getElementById('navMenu');

      if (mobileMenu && navMenu) {
        mobileMenu.onclick = () => {
          navMenu.classList.toggle('active');
          mobileMenu.classList.toggle('active');
        };

        document.querySelectorAll('.nav-link').forEach(link => {
          link.onclick = () => {
            navMenu.classList.remove('active');
            mobileMenu.classList.remove('active');
          };
        });
      }
    });
  </script>
</body>
</html>
